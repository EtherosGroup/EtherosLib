name: Release

# 触发方式：
#  1. 推送形如 v1.0.0 的 tag（推荐）
#  2. 手动触发，填写版本号（会在当前 commit 上自动创建 tag 并发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，例如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::非法的版本号: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 运行器在海外，用官方发行版地址更快；只改 URL，distributionSha256Sum 仍有效
      - name: Use official Gradle distribution in CI
        shell: bash
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep -E '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -PprojectVersion="$VERSION" --console=plain --stacktrace

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "bukkit/build/libs/EtherosLib-Bukkit-${VERSION}.jar" dist/
          cp "velocity/build/libs/EtherosLib-Velocity-${VERSION}.jar" dist/
          cp "common/build/libs/EtherosLib-Common-${VERSION}.jar" dist/
          (cd dist && sha256sum ./*.jar > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: EtherosLib v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
