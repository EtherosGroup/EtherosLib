# 仓库 CI：推 master 与所有 PR 时构建、跑单测、校验产物
#
# 触发：push master、pull_request
# 产物：三个模块的 jar，校验后上传为 workflow artifact
# 密钥：无
# 发布：v* 标签流程见 release.yml

name: ci

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        # 固定镜像版本，构建环境不随 ubuntu-latest 迁移
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: 设置 JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            # 海外运行器使用 Gradle 官方发行版地址；distributionSha256Sum 不随 URL 变化
            - name: 切换 Gradle 发行版地址
              run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

            - name: 设置 Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: 构建与单测
              run: ./gradlew build --no-daemon --console=plain

            - name: 校验产物
              run: bash .github/scripts/verify-artifacts.sh

            - name: 上传产物
              uses: actions/upload-artifact@v7
              with:
                  name: ci-artifacts-${{ github.sha }}
                  path: dist/*
                  if-no-files-found: error
